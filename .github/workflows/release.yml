name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Recode ${{ github.ref_name }}"
          releaseBody: |
            Convert videos without a terminal. Local and private, no uploads.

            ## Download

            | System | File |
            |---|---|
            | macOS (Apple Silicon: M1/M2/M3/M4) | `Recode_*_aarch64.dmg` |
            | macOS (Intel) | `Recode_*_x64.dmg` |
            | Windows | `Recode_*_x64-setup.exe` (or `.msi`) |
            | Linux (Debian/Ubuntu) | `Recode_*_amd64.deb` |
            | Linux (any distro) | `Recode_*_amd64.AppImage` |

            ## Install notes

            **macOS**: the app is not code-signed yet. After moving it to Applications, right-click the app and choose *Open* the first time, or run `xattr -cr /Applications/Recode.app`.

            **Windows**: SmartScreen may warn because the installer is unsigned. Click *More info* then *Run anyway*.

            **Linux (AppImage)**: `chmod +x Recode_*.AppImage` then run it.

            ## ffmpeg included

            ffmpeg is bundled inside the app. Nothing else to install.

            ## Found a bug?

            Use the **Found a bug? Report it** link inside the app (it pre-fills a GitHub issue), or open one directly: https://github.com/AdityaPainuli/recode/issues/new/choose
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
